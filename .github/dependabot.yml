# Version-bump PRs for the shared site themes.
#
# site-themes is installed straight from GitHub at a pinned git tag
# ("github:akshayDev17/site-themes#vX.Y.Z" in frontend/package.json; it is never
# published to npm). Dependabot's npm updater treats a git dependency pinned to a
# version-like tag as versioned and moves it to the newest tag, so each new
# site-themes release opens a PR here that bumps the tag and the lockfile. The
# app only picks up a new theme after that PR merges and the app redeploys.
#
# `allow` limits this to site-themes; every other npm dependency is left alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: daily
    allow:
      - dependency-name: site-themes
    commit-message:
      prefix: deps
