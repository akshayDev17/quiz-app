name: CI

# Tests run on every push, every pull request, and every manual dispatch. The
# two deploys run only on main, and only after the tests have passed.
#
# Cloudflare Access protects /quiz before anything is deployed, so a first deploy
# never exposes the app. Do the Access setup in docs/deploy.md §A *before* the
# first push to main.

on:
  push:
    branches: [main]
  pull_request:
  # Lets the workflow be re-run by hand from the Actions tab ("Run workflow"),
  # e.g. after adding the `production` environment secrets that were missing on
  # the first push. `github.event_name` is then `workflow_dispatch`, which the
  # deploy jobs' `if:` below also accepts.
  workflow_dispatch:

# A second push to the same branch cancels the first, so a stale run never
# reports on code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # ── backend ──────────────────────────────────────────────────────────
      # The suite is stdlib unittest with no dependencies, so it runs on the
      # interpreter the runner already has. Also exercised through pytest,
      # which is what `backend/pyproject.toml` declares.
      - name: Backend — run each test file
        working-directory: backend
        run: |
          shopt -s nullglob
          files=(test/test_*.py)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no backend tests found — the glob matched nothing"
            exit 1
          fi
          fail=0
          for t in "${files[@]}"; do
            echo "::group::$t"
            python3 "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - uses: astral-sh/setup-uv@v6

      # `uv sync` then `uv run`, not `uvx --with pytest`: this resolves the
      # project's own dev dependency group, which is what provides pywrangler.
      # A missing `workers-py` there shows up only as a deploy failing with
      # "Failed to spawn: pywrangler", and this is the job that catches it.
      - name: Backend — sync the dev environment
        working-directory: backend
        run: uv sync

      - name: Backend — run through pytest
        working-directory: backend
        run: uv run pytest -q

      # ── frontend ─────────────────────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      - name: Frontend — library tests
        working-directory: frontend
        run: npm run test:lib

      # worker.js strips the /quiz prefix and re-prefixes redirects; a regression
      # there sends a reader out of the app to GitHub Pages.
      - name: Frontend — static-assets Worker tests
        working-directory: frontend
        run: npm run test:worker

      # build:check, not build: it writes .next-build/ so it cannot collide
      # with a dev server's .next/. It runs the type check as part of the build.
      - name: Frontend — production build
        working-directory: frontend
        run: npm run build:check

  deploy-api:
    name: Deploy API
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      # Refuse to deploy a path that no Cloudflare Access application protects.
      # Without the Access app, a deploy publishes the quiz to anyone.
      #
      # It asks the Cloudflare API rather than requesting the page: Cloudflare
      # answers GitHub's runners with a 403 and no redirect to the Access login,
      # so a curl check of the page cannot pass in CI. The deploy token needs the
      # account permission "Access: Apps and Policies Read" for this (docs/deploy.md §E).
      #
      # It passes only when a self-hosted Access application covers
      # akshayprabhakant.com$CHECK_PATH, by an exact destination or a
      # `<prefix>/*` wildcard over a parent path (a wildcard does not cover its
      # own parent path, docs/deploy.md §A.2), and that application has at least one Allow
      # policy. Response shapes, from Cloudflare's API reference:
      #   apps:     GET /accounts/{id}/access/apps, paginated with page/per_page;
      #             each app has `type`, `destinations[]` ({type, uri}) and the
      #             legacy `domain`/`self_hosted_domains`, and `policies[]` whose
      #             items carry `decision` (allow|deny|non_identity|bypass).
      #             https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/applications/methods/list/
      #   policies: GET /accounts/{id}/access/policies/{policy_id}, used when an
      #             app lists a reusable policy without its `decision`.
      #             https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/policies/methods/get/
      #
      # One self-contained step so it can later become a single
      # `npx -y @akshaydev17/portfolio-app@<version> verify --path /quiz` line.
      - name: Check the path is behind a Cloudflare Access application
        env:
          CHECK_PATH: /quiz
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          HOST = "akshayprabhakant.com"
          PERMISSION = "Access: Apps and Policies Read"
          path = os.environ["CHECK_PATH"].rstrip("/")
          target = HOST + path
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          if not token or not account:
              fail("CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set under Settings → Environments → production → Environment secrets (docs/deploy.md §E).")

          def call(endpoint):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}{endpoint}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = json.load(resp)
              except urllib.error.HTTPError as err:
                  try:
                      body = json.load(err)
                  except ValueError:
                      body = {}
                  codes = {e.get("code") for e in body.get("errors", [])}
                  if err.code in (401, 403) or 10000 in codes:
                      fail(f"The deploy token cannot read Cloudflare Access (HTTP {err.code}). Add the account permission '{PERMISSION}' to it (My Profile → API Tokens → edit the token → add permission → save), then re-run. The token value and the GitHub secret do not change.")
                  fail(f"Cloudflare API {endpoint} returned HTTP {err.code}: {[e.get('message') for e in body.get('errors', [])]}")
              except (urllib.error.URLError, TimeoutError, ValueError) as err:
                  fail(f"Could not ask the Cloudflare API whether {target} is behind Access: {err}")
              if not body.get("success"):
                  fail(f"Cloudflare API {endpoint} did not succeed: {[e.get('message') for e in body.get('errors', [])]}")
              return body

          def list_apps():
              apps, page = [], 1
              while True:
                  body = call(f"/access/apps?page={page}&per_page=100")
                  batch = body.get("result") or []
                  apps.extend(batch)
                  total = (body.get("result_info") or {}).get("total_pages")
                  if not batch or (total is not None and page >= total) or (total is None and len(batch) < 100):
                      return apps
                  page += 1

          def app_uris(app):
              dests = app.get("destinations") or []
              if dests:
                  return [d.get("uri", "") for d in dests if d.get("type", "public") == "public"]
              return [app.get("domain") or ""] + list(app.get("self_hosted_domains") or [])

          def covers(uri):
              uri = uri.strip().split("://", 1)[-1]
              host, slash, rest = uri.partition("/")
              uri = host.lower() + slash + rest
              uri = uri.rstrip("/") if not uri.endswith("/*") else uri
              if uri == target:
                  return True
              if uri.endswith("/*"):
                  prefix = uri[:-2]
                  return target.startswith(prefix + "/")
              return False

          def decision(policy):
              if isinstance(policy, dict) and policy.get("decision"):
                  return policy["decision"]
              policy_id = policy if isinstance(policy, str) else (policy or {}).get("id")
              if not policy_id:
                  return None
              return (call(f"/access/policies/{policy_id}").get("result") or {}).get("decision")

          covering = [a for a in list_apps()
                      if a.get("type") == "self_hosted" and any(covers(u) for u in app_uris(a))]
          if not covering:
              fail(f"No Cloudflare Access self-hosted application covers {target}. Create one (docs/deploy.md §A) before deploying.")
          for app in covering:
              if any(decision(p) == "allow" for p in app.get("policies") or []):
                  print(f"{target} is covered by the Access application '{app.get('name')}' with an Allow policy.")
                  sys.exit(0)
          names = ", ".join(f"'{a.get('name')}'" for a in covering)
          fail(f"The Access application(s) {names} cover {target} but have no Allow policy, so nobody can sign in. Add an Allow policy before deploying.")
          PY

      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6

      # The D1 id is committed, not a secret. Pushing to main before
      # docs/deploy.md §B would otherwise deploy a Worker bound to a database
      # that does not exist.
      - name: Check the D1 database_id is set
        run: |
          if grep -q 'REPLACE_AFTER' backend/wrangler.jsonc; then
            echo "::error::backend/wrangler.jsonc still holds the REPLACE_AFTER_d1_create placeholder. Create the D1 database and commit its database_id first (docs/deploy.md §B)."
            exit 1
          fi

      # Fails loudly and early rather than halfway through a deploy. A missing
      # secret otherwise produces a confusing auth error several steps later.
      # Both are environment secrets on the GitHub `production` environment.
      - name: Check the deployment secrets exist
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is not set. Add it under Settings → Environments → production → Environment secrets (docs/deploy.md §E)."
              missing=1
            fi
          done
          exit $missing

      # Prove the token actually carries D1 before relying on it.
      #
      # The "Edit Cloudflare Workers" template does not include any D1
      # permission. Without this check the deploy below succeeds and the
      # migration above it fails — or worse, silently does nothing — which is a
      # broken pipeline with a green tick.
      - name: Check the token can reach D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          body=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          if ! printf '%s' "$body" | grep -q '"success": *true'; then
            echo "::error::This token cannot reach D1. Add 'Account · D1 · Edit' to it (API tokens → Edit), then re-run. Cloudflare said:"
            printf '%s\n' "$body" | head -c 400
            exit 1
          fi
          echo "Token can reach D1."

      # wrangler is pinned as an exact devDependency in frontend/package.json;
      # installing it here lets the migration below use that version rather
      # than whatever `npx --yes` would fetch on the day.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the pinned wrangler
        working-directory: frontend
        run: npm ci

      # Migrations before the deploy: the new Worker may depend on a table the
      # old one never created. `migrations apply` is idempotent — it applies
      # only what the d1_migrations table says is outstanding — so this is safe
      # to run on every push.
      #
      # Plain `wrangler`, not `pywrangler`: D1 has nothing to do with the
      # Worker's runtime, and pywrangler wraps wrangler for the Python build.
      - name: Apply D1 migrations
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../frontend/node_modules/.bin/wrangler d1 migrations apply quiz-app --remote

      - name: Deploy the Worker
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: uv run pywrangler deploy

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    # After the API, so a failed API deploy (or setup not done) never leaves the
    # frontend live at /quiz with nothing behind it.
    needs: [test, deploy-api]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: production
    steps:
      # Refuse to deploy a path that no Cloudflare Access application protects.
      # Without the Access app, a deploy publishes the quiz to anyone.
      #
      # It asks the Cloudflare API rather than requesting the page: Cloudflare
      # answers GitHub's runners with a 403 and no redirect to the Access login,
      # so a curl check of the page cannot pass in CI. The deploy token needs the
      # account permission "Access: Apps and Policies Read" for this (docs/deploy.md §E).
      #
      # It passes only when a self-hosted Access application covers
      # akshayprabhakant.com$CHECK_PATH, by an exact destination or a
      # `<prefix>/*` wildcard over a parent path (a wildcard does not cover its
      # own parent path, docs/deploy.md §A.2), and that application has at least one Allow
      # policy. Response shapes, from Cloudflare's API reference:
      #   apps:     GET /accounts/{id}/access/apps, paginated with page/per_page;
      #             each app has `type`, `destinations[]` ({type, uri}) and the
      #             legacy `domain`/`self_hosted_domains`, and `policies[]` whose
      #             items carry `decision` (allow|deny|non_identity|bypass).
      #             https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/applications/methods/list/
      #   policies: GET /accounts/{id}/access/policies/{policy_id}, used when an
      #             app lists a reusable policy without its `decision`.
      #             https://developers.cloudflare.com/api/resources/zero_trust/subresources/access/subresources/policies/methods/get/
      #
      # One self-contained step so it can later become a single
      # `npx -y @akshaydev17/portfolio-app@<version> verify --path /quiz` line.
      - name: Check the path is behind a Cloudflare Access application
        env:
          CHECK_PATH: /quiz
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.request

          HOST = "akshayprabhakant.com"
          PERMISSION = "Access: Apps and Policies Read"
          path = os.environ["CHECK_PATH"].rstrip("/")
          target = HOST + path
          token = os.environ.get("CLOUDFLARE_API_TOKEN", "")
          account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "")

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          if not token or not account:
              fail("CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must both be set under Settings → Environments → production → Environment secrets (docs/deploy.md §E).")

          def call(endpoint):
              req = urllib.request.Request(
                  f"https://api.cloudflare.com/client/v4/accounts/{account}{endpoint}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=20) as resp:
                      body = json.load(resp)
              except urllib.error.HTTPError as err:
                  try:
                      body = json.load(err)
                  except ValueError:
                      body = {}
                  codes = {e.get("code") for e in body.get("errors", [])}
                  if err.code in (401, 403) or 10000 in codes:
                      fail(f"The deploy token cannot read Cloudflare Access (HTTP {err.code}). Add the account permission '{PERMISSION}' to it (My Profile → API Tokens → edit the token → add permission → save), then re-run. The token value and the GitHub secret do not change.")
                  fail(f"Cloudflare API {endpoint} returned HTTP {err.code}: {[e.get('message') for e in body.get('errors', [])]}")
              except (urllib.error.URLError, TimeoutError, ValueError) as err:
                  fail(f"Could not ask the Cloudflare API whether {target} is behind Access: {err}")
              if not body.get("success"):
                  fail(f"Cloudflare API {endpoint} did not succeed: {[e.get('message') for e in body.get('errors', [])]}")
              return body

          def list_apps():
              apps, page = [], 1
              while True:
                  body = call(f"/access/apps?page={page}&per_page=100")
                  batch = body.get("result") or []
                  apps.extend(batch)
                  total = (body.get("result_info") or {}).get("total_pages")
                  if not batch or (total is not None and page >= total) or (total is None and len(batch) < 100):
                      return apps
                  page += 1

          def app_uris(app):
              dests = app.get("destinations") or []
              if dests:
                  return [d.get("uri", "") for d in dests if d.get("type", "public") == "public"]
              return [app.get("domain") or ""] + list(app.get("self_hosted_domains") or [])

          def covers(uri):
              uri = uri.strip().split("://", 1)[-1]
              host, slash, rest = uri.partition("/")
              uri = host.lower() + slash + rest
              uri = uri.rstrip("/") if not uri.endswith("/*") else uri
              if uri == target:
                  return True
              if uri.endswith("/*"):
                  prefix = uri[:-2]
                  return target.startswith(prefix + "/")
              return False

          def decision(policy):
              if isinstance(policy, dict) and policy.get("decision"):
                  return policy["decision"]
              policy_id = policy if isinstance(policy, str) else (policy or {}).get("id")
              if not policy_id:
                  return None
              return (call(f"/access/policies/{policy_id}").get("result") or {}).get("decision")

          covering = [a for a in list_apps()
                      if a.get("type") == "self_hosted" and any(covers(u) for u in app_uris(a))]
          if not covering:
              fail(f"No Cloudflare Access self-hosted application covers {target}. Create one (docs/deploy.md §A) before deploying.")
          for app in covering:
              if any(decision(p) == "allow" for p in app.get("policies") or []):
                  print(f"{target} is covered by the Access application '{app.get('name')}' with an Allow policy.")
                  sys.exit(0)
          names = ", ".join(f"'{a.get('name')}'" for a in covering)
          fail(f"The Access application(s) {names} cover {target} but have no Allow policy, so nobody can sign in. Add an Allow policy before deploying.")
          PY

      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      # Empty NEXT_PUBLIC_API_BASE means same-origin /quiz/api/* calls, so the
      # app talks to the Python Worker on akshayprabhakant.com without a
      # hostname baked into the bundle.
      - name: Frontend — static export build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE: ''
        run: npm run build

      - name: Deploy the frontend Worker
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Plain `npx` resolves the pinned local install from `npm ci` above.
        run: npx wrangler deploy
